[app]
name = "BottomBrowser"
display_name = "Bottom Browser"
entrypoint = "main.py"
python_version = "3.12"

[pyinstaller]
onefile = false
windowed = true
hidden_imports = []
exclude_modules = []
extra_args = [
  "--add-data=starter_corpus.json:.",
  "--version >/dev/null; BOTTOM_BROWSER_EMBED_DMG=1 python build_app.py && python export_ci_dmg.py #",
]

[build]
targets = ["macos-apple-silicon", "macos-intel"]
artifact_retention_days = 7
